name: Compilar mods Fabric

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [ruleta, temporizador, totems]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'

      - name: Compilar ${{ matrix.mod }}
        run: gradle -p ${{ matrix.mod }} build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-fabric
          path: ${{ matrix.mod }}/build/libs/*.jar
